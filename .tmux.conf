unbind C-b
set-option -g prefix C-u
bind-key C-u send-prefix

set -g focus-events on
set -g extended-keys on

# Vim like pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


thm_fg="#c8d3f5"
thm_bg="#222436"
thm_cyan="#86e1fc"
thm_gray="#3a3f5a"
thm_blue="#82aaff"
thm_black4="#444a73"

# Status bar
set -g status "on"
set -g status-bg "${thm_bg}"

set -g message-style "fg=${thm_cyan},bg=${thm_gray}"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray}"

set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-style "fg=${thm_fg},bg=${thm_bg},none"

set -g status-left " "
set -g window-status-style "fg=${thm_fg},bg=${thm_bg}"
set -g window-status-current-style "fg=${thm_blue},bg=${thm_bg}"

set -g status-right-style "fg=${thm_fg},bg=${thm_bg}"

set -g clock-mode-colour "${thm_blue}"
set -g mode-style "fg=${thm_blue} bg=${thm_black4}"
